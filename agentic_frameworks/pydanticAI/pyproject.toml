[project]
name = "pydantic-ai-worker"
version = "0.1.0"
description = "Pydantic AI: a worker agent that works a SQLite todo board, with files through an MCP server"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[openai,mcp]>=2.70.0",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
