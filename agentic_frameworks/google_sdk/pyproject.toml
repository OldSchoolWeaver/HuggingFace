[project]
name = "google-sdk"
version = "0.1.0"
description = "Google ADK: a worker agent that works a SQLite todo board, with files through an MCP server"
requires-python = ">=3.13"
dependencies = [
    "google-adk[mcp]>=2.14.1",
    "litellm>=1.110.0",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
